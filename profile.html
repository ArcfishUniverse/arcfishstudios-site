    <main> 
        <section class="profile">

                <h2>Welcome Back, Legend!</h2> 
                <p>Continue your journey with your ArcID!</p> 
                <form id="loginForm" method="POST" class="profile-form"> 

                    <label for="login-username">My ArcID:</label> 
                    <input type="text" id="login-username" name="username" placeholder="Enter Username" required> 

                    <label for="login-password">Password:</label> 
                    <input type="password" id="login-password" name="password" placeholder="Enter Password" required> 

                    <button type="submit">Enter My Legacy</button> 
                </form> 
                <p>No Legacy? Start your journey now!</p> 
                <button onclick="window.location.href='register.html'">Begin My Legacy</button> 
            </div>
             <!-- Profile Card (hidden until logged in) -->
  <div id="profileBox" class="profile-card" style="display:none;">
      <h2 id="welcomeMsg">Welcome, Legend!</h2>
      <div class="profile-details">
          <ul>
              <li><strong>ArcID:</strong> <span id="displayusername"></span></li>
              <li><strong>Email:</strong> <span id="displayemail"></span></li>
              <li><strong>Bio:</strong> <span id="displaybio"></span></li>
          </ul>
      </div>
      <button id="editProfileBtn">Edit Profile</button>
