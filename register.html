 <section class="register">
            <div class="register-card">
                <h2>The world just got a little bigger...</h2>
                <p>Let the world remember you by creating your ArcID!</p>
                <form id="registerForm" method="POST" class="register-form" novalidate>
                    <label for="reg-username">Create ArcID:</label>
                    <input type="text" id="reg-username" name="username" placeholder="Enter Username" required>
                    <br>
                    <label for="reg-password"> Create Password:</label>
                    <input type="password" id="reg-password" name="password" placeholder="Enter Password" required>
                    <br>
                    <label for="reg-confirm-password">Confirm Password:</label>
                    <input type="password" id="reg-confirm-password" name="confirm-password" placeholder="Confirm Password" required>
                    <br>
                    <label for="reg-email">Email Address:</label>
                    <input type="email" id="reg-email" name="email" placeholder="Enter Email" required>
                    <br>
                    <label for="reg-birthdate">Birthdate:</label>
                    <input type="date" id="reg-birthdate" name="birthdate" required>
                    <br>
                    <label class="terms">
                            <input type="checkbox" id="reg-terms" required>
                            I agree to the <a href="#" id="openTerms">Terms of Use</a> and <a href="#" id="openPrivacy">Privacy Policy</a>
                    </label>
                    <div id="modal" class="modal">
                        <div class="modal-content">
                            <span id="closeModal" class="close">&times;</span>
                            <iframe id="modalFrame" src="" width="100%" height="400px"></iframe>
                        </div>
                    </div>
                    <br>
                    <button type="submit">Begin My Journey</button>
                </form>
            </div>
